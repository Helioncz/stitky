<!doctype html>
<html lang="cs"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Štítky{% endblock %} · dokumentace rozvaděčů</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
{% if user %}
<header class="top">
  <a class="brand" href="/">Štítky</a>
  <nav><a href="/">Rozvaděče</a><a href="/settings">Nastavení</a></nav>
  <span class="small">{{ user.tenant.name }} · {{ user.name or user.email }}</span>
  <form method="post" action="/logout"><button class="link" style="color:#fff">Odhlásit</button></form>
</header>
{% endif %}
<main>
{% for kind, msg in messages %}<div class="flash {{ kind }}">{{ msg }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
</body></html>
